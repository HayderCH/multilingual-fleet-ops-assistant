[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "multilingual-fleet-ops-assistant"
version = "1.0.0"
description = "Clean-room multilingual fleet operations assistant for French, Tunisian Arabic and Arabizi."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Hayder Chakroun" }]
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "redis>=5.2,<7",
  "scikit-learn>=1.6,<2",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.8,<1",
]

[project.scripts]
fleet-assistant = "fleet_assistant.api:run"
fleet-benchmark = "fleet_assistant.benchmark:main"
fleet-train-classifier = "fleet_assistant.train_classifier:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fleet_assistant = ["static/*", "data/*", "models/*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
